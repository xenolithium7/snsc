<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xenolithium7/snsc</title>
    <style>
        :root {
            --bg-color: #0d0a12;
            --card-bg: #16121e;
            --accent-pink: #f4b8e4;
            --accent-pink-glow: rgba(244, 184, 228, 0.25);
            --accent-cyan: #70a5fd;
            --text-main: #f5e0dc;
            --text-muted: #9e8e99;
            --text-sub: #6e626e;            /* Тускло-серый для альт-названий */
            --border-color: #2a2133;
            --border-hover: #f4b8e4;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(244, 184, 228, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            margin: 0;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 680px;
            width: 100%;
        }

        /* --- Header --- */
        .header {
            text-align: center;
            padding-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px 0;
            font-size: 2.3rem;
            color: var(--accent-pink);
            letter-spacing: 0.5px;
            text-shadow: 0 0 16px var(--accent-pink-glow);
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- Fleet List --- */
        .fleet-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 10px;
        }

        .scooter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .scooter-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .scooter-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }

        .title-wrapper {
            display: flex;
            align-items: baseline;
            gap: 8px;
            text-align: left;
        }

        .scooter-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .scooter-alt-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-sub);
            letter-spacing: 0.3px;
        }

        /* --- Status Badges --- */
        .status {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-ready {
            background-color: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.15);
        }

        .status-service {
            background-color: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.15);
        }

        .status-repair {
            background-color: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.15);
        }

        /* ❄️ Зимовка (нежно-голубой) */
        .status-winter {
            background-color: rgba(147, 197, 253, 0.12);
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.35);
            box-shadow: 0 0 10px rgba(147, 197, 253, 0.2);
        }

        /* 📦 Хранение (серый) */
        .status-storage {
            background-color: rgba(156, 163, 175, 0.12);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.3);
            box-shadow: 0 0 8px rgba(156, 163, 175, 0.1);
        }

        .odometer-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-pink);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .counter-wrapper {
            display: inline-flex;
            justify-content: center;
            max-width: 100%;
        }

        .anime-counter {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            padding: 8px 14px;
            border-radius: 16px;
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 20px var(--accent-pink-glow);
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .anime-counter img {
            height: 90px;
            width: auto;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 36px;
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>/snsc</h1>
        <div class="subtitle">built by xenolithium7</div>
    </div>

    <div class="fleet-list">
        <!-- Самокат 1 -->
        <div class="scooter-card" id="card-1">
            <div class="scooter-top">
                <div class="title-wrapper">
                    <span class="scooter-title" id="name-1">Ninebot SL90</span>
                    <span class="scooter-alt-title" id="alt-name-1">meow</span>
                </div>
                <span class="status" id="status-1"></span>
            </div>
            <div class="odometer-label">Odometer / Общий пробег</div>
            <div class="counter-wrapper">
                <div class="anime-counter" id="counter-1"></div>
            </div>
        </div>

        <!-- Самокат 2 -->
        <div class="scooter-card" id="card-2">
            <div class="scooter-top">
                <div class="title-wrapper">
                    <span class="scooter-title" id="name-2">Ninebot Max Plus</span>
                    <span class="scooter-alt-title" id="alt-name-2">femboysnsc</span>
                </div>
                <span class="status" id="status-2"></span>
            </div>
            <div class="odometer-label">Odometer / Общий пробег</div>
            <div class="counter-wrapper">
                <div class="anime-counter" id="counter-2"></div>
            </div>
        </div>

        <!-- Самокат 3 -->
        <div class="scooter-card" id="card-3">
            <div class="scooter-top">
                <div class="title-wrapper">
                    <span class="scooter-title" id="name-3">Ninebot Max Plus X</span>
                    <span class="scooter-alt-title" id="alt-name-3">deathmachine</span>
                </div>
                <span class="status" id="status-3"></span>
            </div>
            <div class="odometer-label">Odometer / Общий пробег</div>
            <div class="counter-wrapper">
                <div class="anime-counter" id="counter-3"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        thx for participating: morrics, gunban232, frekst
    </div>
</div>

<script>
    const pathToDigits = 'digits/';
    const BIN_ID = '6a7da34fda38895dfedf2840';
    const API_KEY = '$2a$10$s57nd5TVyp3LhsZRLe/6Xu5FJhJA.y9ZBhIRZrQLs/nXS5mSr4J2C';

    const defaultFleet = {
        "1": { name: "Ninebot SL90", altName: "meow", baseMileage: 1500, currentMileage: 4216, status: 1 },
        "2": { name: "Ninebot Max Plus", altName: "femboysnsc", baseMileage: 0, currentMileage: 1200, status: 1 },
        "3": { name: "Ninebot Max Plus X", altName: "deathmachine", baseMileage: 0, currentMileage: 350, status: 1 }
    };

    function updateStatus(id, statusCode) {
        const badge = document.getElementById(`status-${id}`);
        if (!badge) return;
        badge.className = 'status';

        switch (statusCode) {
            case 1:
                badge.classList.add('status-ready');
                badge.textContent = '● Ready';
                break;
            case 2:
                badge.classList.add('status-service');
                badge.textContent = '● Maintenance Required';
                break;
            case 3:
                badge.classList.add('status-repair');
                badge.textContent = '● Need repair';
                break;
            case 4:
                badge.classList.add('status-winter');
                badge.textContent = '● Winter Storage';
                break;
            case 5:
                badge.classList.add('status-storage');
                badge.textContent = '● Idle';
                break;
            default:
                badge.classList.add('status-ready');
                badge.textContent = '● Ready';
        }
    }

    function renderAnimeCounter(id, mileage) {
        const counterElement = document.getElementById(`counter-${id}`);
        if (!counterElement) return;

        const mileageStr = Math.floor(mileage).toString();
        counterElement.innerHTML = '';

        for (let i = 0; i < mileageStr.length; i++) {
            const digit = mileageStr[i];
            const img = document.createElement('img');
            img.src = `${pathToDigits}${digit}.gif`;
            img.alt = digit;
            counterElement.appendChild(img);
        }
    }

    function renderAll(fleetData) {
        ['1', '2', '3'].forEach(id => {
            const item = fleetData[id] || defaultFleet[id];
            
            const nameEl = document.getElementById(`name-${id}`);
            if (nameEl && item.name) nameEl.textContent = item.name;

            const altNameEl = document.getElementById(`alt-name-${id}`);
            if (altNameEl && item.altName) altNameEl.textContent = item.altName;

            const total = (Number(item.baseMileage) || 0) + (Number(item.currentMileage) || 0);
            renderAnimeCounter(id, total);
            updateStatus(id, Number(item.status) || 1);
        });
    }

    async function loadData() {
        try {
            const headers = {};
            if (API_KEY) {
                headers['X-Master-Key'] = API_KEY;
                headers['X-Access-Key'] = API_KEY;
            }

            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            const fleet = data.record.scooters || defaultFleet;

            localStorage.setItem('cached_fleet', JSON.stringify(fleet));
            renderAll(fleet);
        } catch (error) {
            console.warn('Сбой сети, читаем из кэша localStorage:', error);
            const cached = localStorage.getItem('cached_fleet');
            const fleet = cached ? JSON.parse(cached) : defaultFleet;
            renderAll(fleet);
        }
    }

    // Мгновенный первый рендер из кэша браузера
    const initialCache = localStorage.getItem('cached_fleet');
    renderAll(initialCache ? JSON.parse(initialCache) : defaultFleet);

    loadData();
    setInterval(loadData, 30000);
</script>

</body>
</html>
